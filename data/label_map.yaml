# Shared ontology. Source categories are the exact strings in Aegis V2.
schemes:
  s2: [safe, unsafe]
  s3: [safe, needs_caution, unsafe]
  s6: [safe, needs_caution, hate_harassment_threat, sexual, violence_weapons_crime_substances, self_harm, other]
  s13: [safe, needs_caution, violence, sexual, criminal_planning_confessions, guns_illegal_weapons, controlled_regulated_substances, suicide_self_harm, sexual_minor, hate_identity_hate, pii_privacy, harassment, threat, profanity, other]
category_map:
  Violence: [violence_weapons_crime_substances, violence]
  Sexual: [sexual, sexual]
  Criminal Planning/Confessions: [violence_weapons_crime_substances, criminal_planning_confessions]
  Guns and Illegal Weapons: [violence_weapons_crime_substances, guns_illegal_weapons]
  Controlled/Regulated Substances: [violence_weapons_crime_substances, controlled_regulated_substances]
  Suicide and Self Harm: [self_harm, suicide_self_harm]
  Sexual (minor): [sexual, sexual_minor]
  Hate/Identity Hate: [hate_harassment_threat, hate_identity_hate]
  PII/Privacy: [other, pii_privacy]
  Harassment: [hate_harassment_threat, harassment]
  Threat: [hate_harassment_threat, threat]
  Profanity: [other, profanity]
  Unauthorized Advice: [other, other]
  Political/Misinformation/Conspiracy: [other, other]
  Immoral/Unethical: [other, other]
  Other: [other, other]
  Fraud/Deception: [other, other]
  Illegal Activity: [other, other]
  Malware: [other, other]
  Copyright/Trademark/Plagiarism: [other, other]
  High Risk Gov Decision Making: [other, other]
  Manipulation: [other, other]
