model_name: granite-guardian-4-1-8b-vllm
base_image:
  image: vllm/vllm-openai:v0.29.0
weights:
  - source: "hf://ibm-granite/granite-guardian-4.1-8b@ab01ccca5dcfb80246369a086a4a87a29198f5af"
    mount_location: "/app/checkpoint/model"
docker_server:
  start_command: >-
    sh -c "vllm serve /app/checkpoint/model
    --served-model-name ibm-granite/granite-guardian-4.1-8b
    --dtype bfloat16
    --max-model-len 4096
    --max-num-seqs 32
    --gpu-memory-utilization 0.90
    --port 8000"
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
resources:
  accelerator: L4
  use_gpu: true
runtime:
  predict_concurrency: 32
  health_checks:
    startup_threshold_seconds: 1200
    restart_threshold_seconds: 300
    stop_traffic_threshold_seconds: 120
