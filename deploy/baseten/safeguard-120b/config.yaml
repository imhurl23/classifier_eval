model_name: gpt-oss-safeguard-120b-vllm
base_image:
  image: vllm/vllm-openai:v0.29.0
weights:
  - source: "hf://openai/gpt-oss-safeguard-120b@3c7391182603991a904031244e7822488c67796d"
    mount_location: "/app/checkpoint/model"
docker_server:
  start_command: >-
    sh -c "vllm serve /app/checkpoint/model
    --served-model-name openai/gpt-oss-safeguard-120b
    --max-model-len 4096
    --max-num-seqs 16
    --gpu-memory-utilization 0.95
    --port 8000"
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
resources:
  accelerator: H100
  use_gpu: true
runtime:
  predict_concurrency: 16
  health_checks:
    startup_threshold_seconds: 1800
    restart_threshold_seconds: 300
    stop_traffic_threshold_seconds: 120
